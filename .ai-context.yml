# Dieses Repo ist Teil des Heimgewebes.
# Systemweiter Kontext durch Heimgeist:
#   metarepo/ai-contexts/heimgeist.ai-context.yml

system_context:
  heimgeist: "../metarepo/ai-contexts/heimgeist.ai-context.yml"

ai_context_version: 1.1

project:
  name: vault-gewebe
  summary: Unified personal and shared Obsidian vault for structured knowledge and notes.
  role: knowledge_vault
  primary_language: markdown
  visibility: internal

heimgewebe:
  axis:
    - Events
    - Semantik
    - Decisions
    - Learning
  fleet:
    enabled: false
  wgx:
    profile_expected: false
    guard_smoke_expected: false

interfaces:
  consumes:
    - "contracts/knowledge_graph_schemas"
  produces:
    - "obsidian_vault"
    - "semantic_index"

contracts:
  schemas:
    - path: "contracts/*.schema.json"
      note: "Used for validating frontmatter in knowledge base."

dependencies:
  internal:
    - name: semantah
      relationship: uses
      interface:
        - semantic_linking
        - search_integration
    - name: chronik
      relationship: uses
      interface:
        - ingest_events
    - name: contracts
      relationship: uses
      interface:
        - knowledge_graph_schemas
  external:
    - name: obsidian
      note: local editor platform
    - name: pandoc
      note: exports to other formats

architecture:
  entrypoints:
    - vault/
    - vault/.obsidian/
  key_paths:
    - path: vault/
      purpose: main knowledge base (markdown + canvas files)
    - path: vault/templates/
      purpose: content and project templates
    - path: vault/meta/
      purpose: metadata, indices, linkmaps
  data_flow:
    input: notes, interviews, transcripts, project docs
    processing: tagging → linking → export
    output: semantic index and sync signals

boundaries:
  not_responsible_for:
    - "Direct code execution of software projects (it documents them)"
    - "Hosting services (it is a data store)"
  dangerous_assumptions:
    - "Assume file structure is rigid (Obsidian users move files)"

conventions:
  branching: "main, feature/*"
  commit_prefix: "vault-gewebe"
  ci_platform: github_actions

documentation:
  adr: docs/adr/
  runbook: docs/runbook.md

ai_guidance:
  do:
    - preserve structure of vault folders; filenames human-readable
    - prefer markdown + frontmatter for metadata
    - validate frontmatter fields against contracts where applicable
  dont:
    - auto-modify Obsidian config files
